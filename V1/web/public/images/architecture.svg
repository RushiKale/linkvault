<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="ext" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="web" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#2d2d4e"/>
    </linearGradient>
    <linearGradient id="api" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="db" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">LinkSaver Architecture</text>

  <!-- Layer labels -->
  <text x="40" y="65" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1" text-transform="uppercase">CLIENT LAYER</text>
  <text x="40" y="200" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1" text-transform="uppercase">SERVER LAYER</text>
  <text x="40" y="370" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1" text-transform="uppercase">DATA LAYER</text>

  <!-- Divider lines -->
  <line x1="40" y1="75" x2="860" y2="75" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="40" y1="215" x2="860" y2="215" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="40" y1="385" x2="860" y2="385" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Layer background boxes -->
  <rect x="25" y="50" width="850" height="2" fill="#e2e8f0"/>

  <!-- Chrome Extension -->
  <rect x="50" y="85" width="230" height="100" rx="10" fill="url(#ext)"/>
  <text x="165" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Chrome Extension</text>
  <text x="165" y="135" text-anchor="middle" font-size="11" fill="#c7d2fe">Manifest V3</text>
  <text x="165" y="152" text-anchor="middle" font-size="11" fill="#c7d2fe">Popup · Search · Context Menu</text>
  <text x="165" y="169" text-anchor="middle" font-size="11" fill="#c7d2fe">TypeScript · Ctrl+Shift+K</text>

  <!-- Web Dashboard -->
  <rect x="335" y="85" width="230" height="100" rx="10" fill="url(#web)"/>
  <text x="450" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Web Dashboard</text>
  <text x="450" y="135" text-anchor="middle" font-size="11" fill="#9ca3af">Next.js 15</text>
  <text x="450" y="152" text-anchor="middle" font-size="11" fill="#9ca3af">App Router · TanStack Query</text>
  <text x="450" y="169" text-anchor="middle" font-size="11" fill="#9ca3af">Tailwind CSS · Lucide Icons</text>

  <!-- User -->
  <rect x="620" y="85" width="230" height="100" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6"/>
  <text x="735" y="115" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">👤 Browser / User</text>
  <text x="735" y="135" text-anchor="middle" font-size="11" fill="#64748b">Any modern browser</text>
  <text x="735" y="152" text-anchor="middle" font-size="11" fill="#64748b">Chrome, Edge, Firefox</text>
  <text x="735" y="169" text-anchor="middle" font-size="11" fill="#64748b">(Extension works in Chrome)</text>

  <!-- Arrow: Extension → API -->
  <line x1="280" y1="145" x2="335" y2="145" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="307" y="138" text-anchor="middle" font-size="9" fill="#6366f1">HTTP</text>

  <!-- Arrow: Web → API -->
  <line x1="565" y1="160" x2="610" y2="260" stroke="#1a1a2e" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- API Server -->
  <rect x="50" y="235" width="800" height="120" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="450" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">NestJS API Server — Port 2001</text>

  <!-- API boxes -->
  <rect x="70" y="275" width="110" height="32" rx="6" fill="#d1fae5"/>
  <text x="125" y="296" text-anchor="middle" font-size="11" font-weight="500" fill="#065f46">Auth Module</text>

  <rect x="195" y="275" width="110" height="32" rx="6" fill="#d1fae5"/>
  <text x="250" y="296" text-anchor="middle" font-size="11" font-weight="500" fill="#065f46">Links Module</text>

  <rect x="320" y="275" width="110" height="32" rx="6" fill="#d1fae5"/>
  <text x="375" y="296" text-anchor="middle" font-size="11" font-weight="500" fill="#065f46">Collections</text>

  <rect x="445" y="275" width="110" height="32" rx="6" fill="#d1fae5"/>
  <text x="500" y="296" text-anchor="middle" font-size="11" font-weight="500" fill="#065f46">Tags Module</text>

  <rect x="570" y="275" width="110" height="32" rx="6" fill="#d1fae5"/>
  <text x="625" y="296" text-anchor="middle" font-size="11" font-weight="500" fill="#065f46">Search Module</text>

  <rect x="695" y="275" width="135" height="32" rx="6" fill="#d1fae5"/>
  <text x="762" y="296" text-anchor="middle" font-size="11" font-weight="500" fill="#065f46">Import / Export</text>

  <text x="450" y="330" text-anchor="middle" font-size="10" fill="#6ee7b7">JWT Auth · Rate Limiting · Helmet Security · Prisma ORM</text>

  <!-- Arrow: API → MySQL -->
  <line x1="450" y1="355" x2="450" y2="395" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Arrow: User → Web (browser arrows) -->
  <line x1="735" y1="115" x2="565" y2="115" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <line x1="565" y1="130" x2="735" y2="130" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- Arrow: User → Extension -->
  <line x1="620" y1="155" x2="280" y2="155" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <line x1="280" y1="170" x2="620" y2="170" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- Arrow: Web → API (direct connection) -->
  <line x1="565" y1="145" x2="565" y2="235" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="562" y1="235" x2="565" y2="235" stroke="#1a1a2e" stroke-width="2"/>
  <text x="575" y="195" font-size="10" fill="#475569" font-weight="500">REST API</text>

  <!-- Arrow: Extension → API (direct connection) -->
  <line x1="165" y1="185" x2="165" y2="235" stroke="#6366f1" stroke-width="2"/>
  <line x1="162" y1="235" x2="165" y2="235" stroke="#6366f1" stroke-width="2"/>
  <text x="147" y="215" font-size="10" fill="#6366f1" font-weight="500">REST API</text>

  <!-- MySQL -->
  <rect x="350" y="405" width="200" height="80" rx="10" fill="url(#db)"/>
  <text x="450" y="435" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">MySQL 8</text>
  <text x="450" y="455" text-anchor="middle" font-size="11" fill="#fde68a">utf8mb4_unicode_ci</text>
  <text x="450" y="472" text-anchor="middle" font-size="11" fill="#fde68a">Port 3306</text>

  <!-- Arrow heads -->
  <defs>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
