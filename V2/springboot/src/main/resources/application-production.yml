server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /api-docs
    operations-sorter: method

app:
  cors:
    origins: ${CORS_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
    expiration: 365d
